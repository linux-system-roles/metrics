- name: Assert mode in metrics_grafana_certificates is a string or integer
  ansible.builtin.assert:
    that:
      - (item.mode | type_debug) in ['str', 'int', 'unicode']
    fail_msg: >-
      metrics_grafana_certificates[{{ idx }}].mode must be a string or
