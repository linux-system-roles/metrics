# SPDX-License-Identifier: MIT
---
- name: Check if Grafana works
  uri:
    url: "{{ __metrics_grafana_protocol | d('http') }}://localhost:3000/login"
    method: GET
    status_code: 200
    validate_certs: false
  register: __grafana_result
  until: __grafana_result is success
  delay: "{{ __grafana_pcp_delay | d(2) }}"
  retries: "{{ __grafana_pcp_retries | d(5) }}"
  when: __metrics_is_booted | bool
